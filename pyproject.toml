[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "raksha-collector"
version = "0.1.0"
description = "Traceable, permission-gated Indian road footage collection"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "yt-dlp>=2026.3.3", "Pillow>=11,<13", "ImageHash>=4.3,<5", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
train = [
  "torch==2.10.0",
  "torchvision==0.25.0",
  "ultralytics==8.4.173",
  "opencv-python==4.12.0.88",
  "scikit-learn==1.8.0",
  "tensorboard==2.20.0",
  "numpy==2.2.6",
]

[project.scripts]
raksha-collect = "raksha_collector.cli:main"
raksha-train = "models.raksha_training.cli:main"

[tool.setuptools.packages.find]
include = ["raksha_collector*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
